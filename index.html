<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love  ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* خلفية الصور المتحركة الرومانسية */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: fadeInOut 18s infinite;
        }

        /* توقيتات صور الخلفية المتحركة */
        .bg-slideshow img:nth-child(1) { animation-delay: 0s; }
        .bg-slideshow img:nth-child(2) { animation-delay: 6s; }
        .bg-slideshow img:nth-child(3) { animation-delay: 12s; }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 1; transform: scale(1.05); }
            33% { opacity: 1; transform: scale(1.08); }
            43% { opacity: 0; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* طبقة عتمة شفافة فوق الصور عشان الكلام يبدو واضح ومرتب */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* صندوق إدخال الرقم السري الأنيق */
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            color: #fff;
        }

        .login-card h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 20px;
            border: none;
            outline: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.85);
            color: #333;
            font-size: 16px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .login-card input:focus {
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: 0.3s;
        }

        .login-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 65, 108, 0.6);
        }

        .error-msg {
            color: #ff8080;
            margin-top: 10px;
            font-size: 14px;
            display: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- خلفية الصور الرومانسية المتحركة -->
    <div class="bg-slideshow">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80" alt="Romantic 1">
        <img src="https://images.unsplash.com/photo-1494774157365-9e04c6720e47?auto=format&fit=crop&w=1920&q=80" alt="Romantic 2">
        <img src="https://images.unsplash.com/photo-1522748982260-6b83c50005d5?auto=format&fit=crop&w=1920&q=80" alt="Romantic 3">
    </div>
    <div class="overlay"></div>

    <!-- صندوق الدخول -->
    <div class="login-card">
        <h2>🔒 أخلِص السر أو التاريخ المميز</h2>
        <div class="input-group">
            <input type="password" id="passcode" placeholder="مثال: 2024 أو تاريخ ميلاد">
        </div>
        <button onclick="checkPass()">دخول الذكريات ❤️</button>
        <p id="error" class="error-msg">عفواً، الرقم غير صحيح!</p>
    </div>

    <script>
        function checkPass() {
            var pass = document.getElementById('passcode').value;
            // تقدر تغير الرقم السري هنا من '2024' للرقم اللي تعوزه
            if(pass === "2024") {
                alert("مرحباً بك يا غالي، تم الدخول بنجاح! ❤️");
                // هنا تقدر تربطها بصفحة ثانية لو حابب، مثلاً: window.location.href = "home.html";
            } else {
                document.getElementById('error').style.display = "block";
            }
        }
    </script>
</body>
</html>
