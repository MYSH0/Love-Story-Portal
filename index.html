<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Love ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* خلفية الصور المتحركة المتعددة */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: slideAnimation 36s infinite;
        }

        /* توقيتات الـ 6 صور (كل صوره بتقعد فترة وتتغير لللي بعدها) */
        .bg-slideshow img:nth-child(1) { animation-delay: 0s; }
        .bg-slideshow img:nth-child(2) { animation-delay: 6s; }
        .bg-slideshow img:nth-child(3) { animation-delay: 12s; }
        .bg-slideshow img:nth-child(4) { animation-delay: 18s; }
        .bg-slideshow img:nth-child(5) { animation-delay: 24s; }
        .bg-slideshow img:nth-child(6) { animation-delay: 30s; }

        @keyframes slideAnimation {
            0% { opacity: 0; transform: scale(1); }
            5% { opacity: 1; transform: scale(1.03); }
            20% { opacity: 1; transform: scale(1.07); }
            25% { opacity: 0; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* طبقة عتمة لتوضيح الكلام وزيادة الجاذبية */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* صندوق الدخول الزجاجي المميز */
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 45px 35px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 90%;
            color: #fff;
            animation: fadeInCard 1.2s ease-out;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            margin-bottom: 25px;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            outline: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .login-card input:focus {
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
        }

        .login-card button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
            transition: 0.3s;
        }

        .login-card button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.7);
        }

        .error-msg {
            color: #ff9999;
            margin-top: 12px;
            font-size: 14px;
            display: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- خلفية تتضمن 6 صور رومانسية متحركة -->
    <div class="bg-slideshow">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80" alt="1">
        <img src="https://images.unsplash.com/photo-1494774157365-9e04c6720e47?auto=format&fit=crop&w=1920&q=80" alt="2">
        <img src="https://images.unsplash.com/photo-1522748982260-6b83c50005d5?auto=format&fit=crop&w=1920&q=80" alt="3">
        <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1920&q=80" alt="4">
        <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=1920&q=80" alt="5">
        <img src="https://images.unsplash.com/photo-1501901609772-df0848060b33?auto=format&fit=crop&w=1920&q=80" alt="6">
    </div>
    <div class="overlay"></div>

    <!-- صندوق الدخول -->
    <div class="login-card">
        <h2>🔒 أخلِص السر أو التاريخ المميز</h2>
        <div class="input-group">
            <input type="password" id="passcode" placeholder="مثال: 2024 أو تاريخ ميلاد">
        </div>
        <button onclick="checkPass()">دخول الذكريات ❤️</button>
        <p id="error" class="error-msg">عفواً، الرقم غير صحيح!</p>
    </div>

    <script>
        function checkPass() {
            var pass = document.getElementById('passcode').value;
            if(pass === "2024") {
                alert("مرحباً بك يا غالي، تم الدخول بنجاح! ❤️");
            } else {
                document.getElementById('error').style.display = "block";
            }
        }
    </script>
</body>
</html>
