<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* خلفية الصور المتحركة بروابط بديلة ومضمونة */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
        }

        .bg-slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: imageAnimation 20s infinite;
        }

        /* توقيتات ظهور وتلاشي الصور */
        .bg-slideshow img:nth-child(1) { animation-delay: 0s; }
        .bg-slideshow img:nth-child(2) { animation-delay: 5s; }
        .bg-slideshow img:nth-child(3) { animation-delay: 10s; }
        .bg-slideshow img:nth-child(4) { animation-delay: 15s; }

        @keyframes imageAnimation {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 1; }
            30% { opacity: 1; transform: scale(1.05); }
            40% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* طبقة عتمة رومانسية لتوضيح المربع والكتابة */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* صندوق الدخول الفخم والمطور */
        .login-card {
            position: relative;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 50px 35px;
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 440px;
            width: 90%;
            color: #fff;
            z-index: 10;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 37px;
            padding: 2px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c, #ff69b4);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
            pointer-events: none;
        }

        .login-card h2 {
            margin-bottom: 25px;
            font-size: 23px;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .login-card input {
            width: 100%;
            padding: 16px 22px;
            border: 2px solid transparent;
            outline: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 17px;
            text-align: center;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.15);
            transition: 0.4s;
        }

        .login-card input:focus {
            background: #fff;
            border-color: #ff416c;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.8);
        }

        .login-card button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.6);
            transition: 0.4s;
            letter-spacing: 0.5px;
        }

        .login-card button:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 12px 30px rgba(255, 65, 108, 0.85);
        }

        .error-msg {
            color: #ff9999;
            margin-top: 15px;
            font-size: 15px;
            display: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- الخلفية المتحركة بروابط صور بديلة -->
    <div class="bg-slideshow">
        <img src="https://images.pexels.com/photos/1024960/pexels-photo-1024960.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="1">
        <img src="https://images.pexels.com/photos/1440733/pexels-photo-1440733.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="2">
        <img src="https://images.pexels.com/photos/1190298/pexels-photo-1190298.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="3">
        <img src="https://images.pexels.com/photos/1344076/pexels-photo-1344076.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="4">
    </div>
    <div class="overlay"></div>

    <!-- صندوق الدخول -->
    <div class="login-card">
        <h2>🔒 دخل كلمه السر الى قولتهالك</h2>
        <div class="input-group">
            <input type="password" id="passcode" placeholder="مثال: يوم مميز أو تاريخ ميلاد">
        </div>
        <button onclick="checkPass()">دخول الذكريات ❤️</button>
        <p id="error" class="error-msg">عفواً، الرقم غير صحيح!</p>
    </div>

    <script>
        function checkPass() {
            var pass = document.getElementById('passcode').value;
            if(pass === "2024") {
                alert("مرحباً بك يا غالي، تم الدخول بنجاح! ❤️");
            } else {
                document.getElementById('error').style.display = "block";
            }
        }
    </script>
</body>
</html>
